<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>語音轉文字下載器</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="container">
      <section class="panel">
        <h1>語音辨識轉字幕</h1>
        <p class="subtitle">只支援音檔（mp3/wav/m4a），單檔上限 {{ max_file_mb }}MB。</p>
        <p class="warning">系統不保留辨識檔案，請在完成後立即下載 TXT / SRT。</p>

        <div class="auth">
          <div id="googleBtn"></div>
          <button id="logoutBtn" type="button" class="secondary" hidden>登出</button>
          <p id="userInfo" class="status">請先使用 Google 登入</p>
        </div>

        <form id="transcribe-form">
          <label class="field">
            <span>音檔語言</span>
            <select id="language" name="language">
              <option value="auto">自動辨識</option>
              <option value="zh">繁體中文</option>
              <option value="en">英文</option>
              <option value="ja">日文</option>
              <option value="ko">韓文</option>
            </select>
            <small>有指定語言時，語音辨識通常會更快速。</small>
          </label>

          <label class="field">
            <span>上傳音檔（mp3/wav/m4a）</span>
            <input id="audioFile" name="audioFile" type="file" accept=".mp3,.wav,.m4a,audio/*" required />
          </label>
          <div class="upload-note">
            <strong>壓縮建議</strong>
            <p>單檔上限 {{ max_file_mb }}MB。建議輸出成 96kbps，約可上傳 35 分鐘；64kbps 約 52 分鐘；128kbps 約 26 分鐘。</p>
            <p>音檔 kbps 主要影響檔案大小，一般語音內容壓縮到 64-96kbps 不會明顯影響辨識能力。</p>
          </div>

          <button id="submitBtn" type="submit" disabled>開始辨識</button>
        </form>

        <div id="adminPanel" class="admin" hidden>
          <h2>管理者調整分鐘</h2>
          <form id="admin-form">
            <input id="targetEmail" type="email" placeholder="使用者 Email" required />
            <input id="targetMinutes" type="number" min="0" step="0.1" placeholder="分鐘數" required />
            <button type="submit">更新分鐘</button>
          </form>
          <p id="adminStatus" class="status"></p>

          <div class="admin-users-header">
            <h2>使用者列表</h2>
            <button id="refreshUsersBtn" type="button" class="secondary">重新整理</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>Email</th>
                  <th>剩餘分鐘</th>
                  <th>身分</th>
                  <th>更新時間</th>
                </tr>
              </thead>
              <tbody id="adminUsersBody">
                <tr>
                  <td colspan="5">尚未載入</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <p id="status" class="status">等待上傳檔案</p>

        <div class="actions">
          <button id="downloadTxt" disabled>下載 TXT</button>
          <button id="downloadSrt" disabled>下載 SRT</button>
        </div>

        <label class="field">
          <span>辨識結果</span>
          <textarea id="resultText" rows="12" placeholder="完成後會顯示文字"></textarea>
        </label>
      </section>
    </main>

    <script>
      window.GOOGLE_CLIENT_ID = "{{ google_client_id }}";
      window.MAX_FILE_MB = {{ max_file_mb }};
    </script>
    <script src="/static/app.js"></script>
  </body>
</html>
